server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: campus-safety
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # PostgreSQL 数据库
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campus_safety}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# JWT 配置
jwt:
  secret: ${JWT_SECRET:CampusSafety2026SecretKeyForJwtTokenGenerationMustBeLongEnough}
  expiration: ${JWT_EXPIRATION:86400000}

# AI 服务配置
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8089/api/ai}

# Knife4j API文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '所有接口'
      paths-to-match: '/**'
      packages-to-scan: com.campussafety.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: '数据模型'

# 天地图瓦片 key（https://console.tianditu.gov.cn/ 申请），写入后 __TK__ 占位符才会生效
tianditu:
  tk: ${TIANDITU_TK:}

# 日志级别
logging:
  level:
    com.campussafety: ${LOG_LEVEL:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
