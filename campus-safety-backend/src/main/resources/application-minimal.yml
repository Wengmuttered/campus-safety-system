# ============================================================
# 最小启动配置 — 仅需 PostgreSQL，无需 Redis
# 用法: java -jar app.jar --spring.profiles.active=minimal
# 适用于比赛现场 Redis 服务不便启动的场景
# ============================================================

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campus_safety}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:campus2026}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8089/api/ai}

logging:
  level:
    com.campussafety: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
